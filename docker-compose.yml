services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aztools}
      POSTGRES_USER: ${POSTGRES_USER:-aztools}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aztools}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aztools}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-aztools}:${POSTGRES_PASSWORD:-aztools}@db:5432/${POSTGRES_DB:-aztools}
    volumes:
      - media:/app/media
      - staticfiles:/app/staticfiles
    expose:
      - "8000"

  fibras-sync:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-aztools}:${POSTGRES_PASSWORD:-aztools}@db:5432/${POSTGRES_DB:-aztools}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        python manage.py wait_for_db
        while true; do
          echo "[fibras-sync] Sincronizando precios..."
          python manage.py sync_fibras
          echo "[fibras-sync] Listo. Esperando 24h..."
          sleep 86400
        done

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"

  # Respaldo diario: pg_dump de la BD + tar del volumen de media,
  # a una carpeta del host (fuera de los volúmenes Docker), retención 14 días.
  # OJO: vive en el mismo disco físico — protege contra borrados/corrupción,
  # no contra falla del disco. Segunda copia (USB/Drive) pendiente.
  db-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-aztools}
      PGPASSWORD: ${POSTGRES_PASSWORD:-aztools}
      PGDATABASE: ${POSTGRES_DB:-aztools}
    volumes:
      - media:/media-src:ro
      - ${BACKUP_DIR:-/home/adrian/respaldos-aztools}:/respaldos
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          FECHA=$$(date +%Y-%m-%d_%H%M)
          echo "[db-backup] Respaldando base de datos..."
          if pg_dump -Fc -f "/respaldos/db_$${FECHA}.dump"; then
            echo "[db-backup] BD OK: db_$${FECHA}.dump"
          else
            echo "[db-backup] ERROR en pg_dump"
          fi
          echo "[db-backup] Respaldando media (comprobantes, logos)..."
          if tar -czf "/respaldos/media_$${FECHA}.tar.gz" -C /media-src .; then
            echo "[db-backup] Media OK: media_$${FECHA}.tar.gz"
          else
            echo "[db-backup] ERROR en tar de media"
          fi
          echo "[db-backup] Aplicando retención de 14 días..."
          find /respaldos -name 'db_*.dump' -mtime +14 -delete
          find /respaldos -name 'media_*.tar.gz' -mtime +14 -delete
          echo "[db-backup] Listo. Próximo respaldo en 24h."
          sleep 86400
        done

volumes:
  postgres_data:
  media:
  staticfiles:
